label = "环境残留：engine/tests 下有 AI 生成用例（跑过 run_draft / agent-demo 就会留下，会让 engine 与全仓用例数各 +1）"
kind = "watch"
probe = "glob_count"
args = { dir = "packages/engine/tests", pattern = "test_ai_generated*.py" }
note = "文件被 .gitignore 忽略（`test_ai_generated*.py`），但落在 pytest 会收集的目录里。clean clone 上数字是 960/全仓 X；跑过 agent 演示后变 961/X+1。对外报数字前先归档清掉——2026-10-07 就是这么被抓到的。"

[[claim]]
id = "watch.ci_eval_step"
label = "CI 里出现了 eval 步骤（ARCHITECTURE 关于门禁的说法需要复核）"
kind = "watch"
probe = "file_regex_count"
args = { file = ".github/workflows/ci.yml", pattern = '\beval\b' }
note = "当前 CI 无 eval 步骤（A/B 门禁只在本地 CLI 跑）。哪天真接进 CI，这条会亮，提示同步 ARCHITECTURE §2.8 / §4 的说法。"

