args = { file = "docs/decisions.md", pattern = '^## ADR-' }
sites = [
  { file = "../../resume/_口径卡_项目数字.md", pattern = '\*\*(?P<value>\d+) 条 ADR\*\*' },
]

# ---------------------------------------------------------------------------
# 覆盖率（依赖 CI 产出的 coverage.json；本地没跑 --cov 时跳过）
# ---------------------------------------------------------------------------

[[claim]]
id = "coverage.engine"
label = "engine 覆盖率"
kind = "number"
probe = "coverage_percent"
args = { file = "packages/engine/coverage.json" }
sites = [
  { file = "../../resume/_口径卡_项目数字.md", pattern = '覆盖率 \*\*(?P<value>\d+\.\d+)%\*\*' },
]

[[claim]]
id = "coverage.testgen"
label = "testgen 覆盖率"
kind = "number"
probe = "coverage_percent"
args = { file = "packages/testgen/coverage.json" }
sites = [
  { file = "packages/testgen/docs/metrics.md", pattern = '170 passed / (?P<value>\d+\.\d+)%' },
]

# ---------------------------------------------------------------------------
# 状态声称：实现标记在 → 该行必须是 ✅（反向亦然）
# ---------------------------------------------------------------------------

[[claim]]
id = "status.context_budget"
label = "上下文预算裁剪是否已落地"
kind = "number"
probe = "status_symbol"
args = { marker_file = "packages/agent/src/tcms_agent/nodes.py", marker_pattern = 'def _apply_context_budget' }
sites = [
  { file = "docs/ARCHITECTURE.md", pattern = '上下文预算裁剪 / 压缩 \| (?P<value>[⬜✅])' },
]

[[claim]]
id = "status.rerank_fusion"
label = "真 embedding / 图谱入融合 / rerank 是否已落地"
kind = "number"
probe = "status_symbol"
args = { marker_file = "packages/agent/src/tcms_agent/config.py", marker_pattern = 'rerank_enabled' }
sites = [
  { file = "docs/ARCHITECTURE.md", pattern = '真 embedding / 图谱入融合 / rerank \| (?P<value>[⬜✅])' },
]

[[claim]]
id = "status.nolib"
label = "nolib 手写最小 loop 对照是否已落地"
kind = "number"
probe = "status_symbol"
args = { marker_file = "packages/agent/src/tcms_agent/nolib/__init__.py", marker_pattern = '.' }
sites = [
  { file = "docs/ARCHITECTURE.md", pattern = '`nolib/` 手写最小 loop 对比 \| (?P<value>[⬜✅])' },
]

# ---------------------------------------------------------------------------
# 接口面：代码里没有的东西，文档不许教人用
# ---------------------------------------------------------------------------

[[claim]]
id = "surface.offline_flag"
label = "run 子命令是否存在 --offline"
kind = "forbid"
probe = "file_regex_count"
args = { file = "packages/agent/src/tcms_agent/cli.py", pattern = 'add_argument\("--offline"' }
sites = [
  { file = "packages/agent/README.md", pattern = '`--offline`', forbid = true },
]
note = "cli.py 只有 --llm，没有 --offline；离线臂靠「无 key」触发。文档教人用不存在的参数 = 照着做会失败。"

[[claim]]
id = "surface.eval_arms"
label = "评测臂清单（5 只）是否在 README 里列全"
kind = "tokens"
probe = "harness_arms"
args = { file = "packages/agent/src/tcms_agent/eval/harness.py", pattern = 'def default_arms\(\).*?\n\s*\]' }
sites = [
  { file = "packages/agent/README.md" },
]
note = "run 的决策臂只有 2 只（offline-rule/llm），评测 harness 有 5 只——两张表不能互相顶替。"

# ---------------------------------------------------------------------------
# 观察项：不阻断，但会让「对外数字只在本机成立」的环境因素
# ---------------------------------------------------------------------------

[[claim]]
id = "watch.generated_tests"
label = "环境残留：engine/tests 下有 AI 生成用例（跑过 run_draft / agent-demo 就会留下，会让 engine 与全仓用例数各 +1）"
kind = "watch"
probe = "glob_count"
args = { dir = "packages/engine/tests", pattern = "test_ai_generated*.py" }
note = "文件被 .gitignore 忽略（`test_ai_generated*.py`），但落在 pytest 会收集的目录里。clean clone 上数字是 960/全仓 X；跑过 agent 演示后变 961/X+1。对外报数字前先归档清掉——2026-10-07 就是这么被抓到的。"

