# 文档自证登记表 —— 「文档里写的」与「实物」的唯一对照源
#
# 规则
#   · 加一个对外数字/状态声明 = 在这里加一条 claim；没登记的声明门禁不认识它。
#   · tier = "authority" 不一致 => FAIL（CI 红）；"history" => 仅提示。
#   · pattern 用 TOML 字面串（单引号）写正则，捕获组必须叫 value。
#   · 拿不到数据（上游缺失 / 只跑子集 / coverage.json 不存在）时如实跳过，不猜。
#
# 用法
#   uv run python scripts/check_claims.py --report     # 看漂移表
#   uv run python scripts/check_claims.py --check      # CI / pytest 用
#   uv run python scripts/check_claims.py --fix        # 就地改写数字（人审 diff）

# ---------------------------------------------------------------------------
# 用例数
#
# 「N passed + M skipped」这类声明分三层守：
#   · tests.full         —— kind=sum：只校验 passed + skipped == 收集数。
#                           CI 与 pytest 只能拿到收集结果（skip 是运行期决定的），
#                           这一层是所有环境都跑得动的不变量。
#   · tests.full_passed  —— 钉死 passed 的**绝对值**，需要 `--full-run` 真跑一遍。
#   · tests.full_skipped —— 同理钉死 skipped。
# 发版前：uv run python scripts/check_claims.py --report --full-run
# ---------------------------------------------------------------------------

[[claim]]
id = "tests.full"
label = "全仓用例数（合计不变量）"
kind = "sum"
probe = "collected_total"
sites = [
  { file = "README.md", pattern = '\*\*(?P<value>\d+) passed \+ (?P<skipped>\d+) skipped\*\*' },
  { file = "../../resume/_口径卡_项目数字.md", pattern = '\*\*(?P<value>\d+) passed \+ (?P<skipped>\d+) skipped\*\*' },
]

[[claim]]
id = "tests.full_passed"
label = "全仓 passed 数"
kind = "number"
probe = "passed_total"
sites = [
  { file = "README.md", pattern = 'tests-(?P<value>\d+)%20passed' },
  { file = "README.md", pattern = '\*\*(?P<value>\d+) passed \+ \d+ skipped\*\*' },
  { file = "../../resume/_口径卡_项目数字.md", pattern = '\*\*(?P<value>\d+) passed \+ \d+ skipped\*\*' },
  { file = "../../resume/_口径卡_项目数字.md", pattern = '\*\*现为 (?P<value>\d+)\*\*' },
  { file = "../../resume/_口径卡_项目数字.md", pattern = '还是 (?P<value>\d+)）' },
]
note = "需要 --full-run；只有收集结果时如实跳过（值不可得 ≠ 值正确）。"

[[claim]]
id = "tests.full_skipped"
label = "全仓 skipped 数"
kind = "number"
probe = "skipped_total"
sites = [
  { file = "README.md", pattern = '\*\*\d+ passed \+ (?P<value>\d+) skipped\*\*' },
  { file = "../../resume/_口径卡_项目数字.md", pattern = '\*\*\d+ passed \+ (?P<value>\d+) skipped\*\*' },
]
note = "4 条 skip 都是条件性的（真语义通道/CAN 硬件），数量变化要能解释。"

[[claim]]
id = "tests.engine"
label = "engine 用例数"
kind = "number"
probe = "collected_package"
args = { package = "engine" }
sites = [
  { file = "../../resume/_口径卡_项目数字.md", pattern = '\*\*(?P<value>\d+) 个用例\*\*' },
]

