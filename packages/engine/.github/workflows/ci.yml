name: CI

on:
  push:
    branches: [main]
  pull_request:

# bot 徽章提交需要写权限；deploy-pages 需要 pages 部署权限（显式声明，
# 防仓库默认权限漂移）
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # PR 快速反馈：冒烟层（核心安全路径，~1s）先行，不阻塞于全量矩阵
  pr-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke layer (core safety paths)
        run: python -m pytest tests/ -m smoke -q --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check tcms tests demo.py run.py scripts
      - name: Check formatting with ruff
        run: ruff format --check tcms tests demo.py run.py scripts

  test:
    runs-on: ubuntu-latest
    needs: [pr-smoke, lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full regression (coverage gate from pyproject)
        # 覆盖率门禁单源：pyproject [tool.coverage.report] fail_under=97
        # （此前 CI 另传 --cov-fail-under=97 造成阈值双源，已收敛）
        run: python -m pytest tests/ -v --tb=short --html=report.html --self-contained-html --junitxml=reports/junit-py${{ matrix.python-version }}.xml --alluredir=allure-results --cov=tcms --cov-report=term --cov-report=json
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: report.html
      - name: Upload Allure results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-py${{ matrix.python-version }}
          path: allure-results/
      - name: Upload JUnit XML
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/junit-py${{ matrix.python-version }}.xml
      - name: Upload coverage JSON
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.json
      # main 分支：用 3.12 真实产物自证 README 徽章（防手抄漂移）
      - name: Self-prove README badges
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.12' && github.event_name != 'pull_request'
        run: |
          python scripts/gen_badges.py --junit reports/junit-py3.12.xml --coverage-json coverage.json
      - name: Commit self-proven badges
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.12' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || {
            git add README.md
            # [skip ci]：徽章自证提交不重新触发 CI（防递归循环）
            git commit -m "docs: 徽章数字自证（CI 产物） [skip ci]"
            # 并发 main push 竞态：非快进则 rebase 后重推一次
            git pull --rebase origin main || true
            git push
          }

  demo-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke demo.py
        run: PYTHONIOENCODING=utf-8 python demo.py
      - name: Smoke examples replay chain
        run: |
          PYTHONIOENCODING=utf-8 python examples/replay_demo.py
          PYTHONIOENCODING=utf-8 python examples/replay_demo.py --report
      - name: Smoke consumer API example
        # 第二消费者实证：仅经 tcms 公共 API 完成 总线→场景→回放
        run: PYTHONIOENCODING=utf-8 python examples/consumer_api.py
      - name: Render trend report from junit
        run: |
          python -m pytest tests/ -m smoke -q --junitxml=reports/junit-smoke.xml
          python scripts/report_history.py --ascii
          python scripts/report_history.py -o reports/TREND.md
      - name: Run performance benchmark (quick)
        run: |
          python scripts/benchmark.py --quick --json reports/benchmark.json
          cat reports/benchmark.json
      - name: Upload trend report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trend-report
          path: reports/TREND.md
      - name: Smoke plot_timeline.py
        run: PYTHONIOENCODING=utf-8 python scripts/plot_timeline.py
      - name: Upload timeline artifact
        uses: actions/upload-artifact@v7
        with:
          name: timeline-demo
          path: docs/timeline_demo.png

  # wheel 分发契约门禁：非 editable 安装后仍开箱可用。
  # 堵住历史盲区（此前 requirements.txt 为 -e .[…]，DBC 在包外从未暴露）
  dist-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install --upgrade pip build
      - name: Build wheel
        run: python -m build --wheel --outdir dist
      - name: Install wheel in clean venv (non-editable)
        run: |
          python -m venv /tmp/venv-dist
          /tmp/venv-dist/bin/python -m pip install dist/*.whl pytest
      - name: Distribution self-check (import assets from outside repo)
        run: |
          cd /tmp
          # $GITHUB_WORKSPACE 指向 checkout 根（不硬编码仓库名路径）
          /tmp/venv-dist/bin/python "$GITHUB_WORKSPACE/scripts/check_dist.py"
      - name: Console entrypoint smoke
        run: |
          /tmp/venv-dist/bin/tcms-test --version
          /tmp/venv-dist/bin/python -c "import tcms; db=tcms.load_database(); print('msgs', len(db.messages)); print('faults', tcms.load_fault_dictionary().report()['total'])"

  # main 分支：CI 成功后直接把本 run 的 3.12 产物渲染为 docs/reports/
  # 并部署 GitHub Pages。与 test 同 run → download-artifact 无需跨
  # workflow（跨 workflow 的 run-id 下载有权限/可见性限制，已弃用）。
  # 无 bot 提交、无递归触发；PR/其他分支不部署。
  deploy-pages:
    runs-on: ubuntu-latest
    needs: [test, demo-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download 3.12 JUnit XML
        uses: actions/download-artifact@v7
        with:
          name: junit-py3.12
          path: artifacts/
      - name: Download 3.12 coverage JSON
        uses: actions/download-artifact@v7
        with:
          name: coverage-py3.12
          path: artifacts/
      - name: Download 3.12 HTML report
        uses: actions/download-artifact@v7
        with:
          name: pytest-report-py3.12
          path: artifacts/
      - name: Render docs/reports/ (trend + latest.json + html)
        run: |
          ls -la artifacts/
          python scripts/render_pages.py --artifacts artifacts --out docs/reports --run-id "${{ github.run_id }}"
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

