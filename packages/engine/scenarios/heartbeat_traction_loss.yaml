# 场景 10：VCU 心跳丢失 + 牵引丢失 —— 动力源消失级联
# F-TCMS-008 heartbeat_loss_vcu (major, derate) + F-TCMS-006 traction_loss (major, derate)
# 主控心跳中断触发降级；牵引系统丢失后维持降级运行，恢复后解除
name: 心跳丢失与牵引丢失级联
desc: 演示故障序列：VCU 心跳丢失、牵引丢失。
steps:
  - at: 1.0
    inject:
      node: vcu
      fault: heartbeat_loss_vcu
      level: major
      impact: VCU 心跳中断，看门狗判定主控失联，请求降级
      expect: derate
  - at: 4.0
    inject:
      node: bcu
      fault: traction_loss
      level: major
      impact: 牵引系统故障丢失，列车动力受限
      expect: derate
  - at: 10.0
    recover: heartbeat_loss_vcu
  - at: 12.0
    recover: traction_loss
