[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcms-agent"
dynamic = ["version"]
description = "TCMS 全流程测试工程师 Agent：LangGraph 编排的核心循环 + 分级工具面 + 多层记忆 + 评测体系"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zych2002918", email = "1612836914@qq.com" }]
keywords = ["TCMS", "railway", "agent", "LangGraph", "AI-testing", "LLM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

# 运行时依赖：编排框架 + 复用的领域底座（platform 提供资产模型与知识底座）
dependencies = [
    "tcms-can-test",
    "tcms-ai-platform",
    # --- 编排框架（选型理由见 docs/decisions.md ADR-001）---
    # LangGraph 提供的正是 harness 需要的基础设施：
    #   checkpointer（轨迹持久化/断点续跑）、interrupt（人在环路审批）、
    #   stream（实时可观测）、time-travel（轨迹回放）、Store（跨会话长期记忆）
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
lint = ["ruff>=0.5"]

[project.scripts]
tcms-agent = "tcms_agent.cli:main"

[tool.uv.sources]
tcms-can-test = { workspace = true }
tcms-ai-platform = { workspace = true }

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
    "tcms_agent",
    "tcms_agent.tools",
    "tcms_agent.memory",
]

[tool.setuptools.dynamic]
version = { attr = "tcms_agent._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_markers = true
markers = [
    "llm: 需要真实 LLM API（默认跳过，CI 只跑离线确定性模式）",
    "slow: 较慢的集成用例",
]

[tool.coverage.run]
source = ["tcms_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
