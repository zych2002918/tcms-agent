name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    # 双仓平级布局（与 asset_loader.default_upstream_root 的解析一致）：
    #   $GITHUB_WORKSPACE/
    #     ├─ testgen/           ← 本仓库（REPO_ROOT = $GITHUB_WORKSPACE）
    #     └─ tcms-can-test/     ← 上游被测引擎（真实执行 / 变异杀毒需要）
    # 注意：actions/checkout 不允许落到 $GITHUB_WORKSPACE 之外。
    # 曾用 path: ../tcms-can-test，被拒并报
    # "Repository path ... is not under ..."，导致 CI 从未跑通；
    # 故两仓都放在工作区内做平级。
    defaults:
      run:
        working-directory: testgen
    steps:
      - uses: actions/checkout@v4
        with:
          path: testgen
      - name: Checkout upstream tcms-can-test (real-exec integration target)
        # 真实执行器/变异杀毒需上游被测平台；克隆到工作区内与 testgen 平级
        uses: actions/checkout@v4
        with:
          repository: zych2002918/tcms-can-test
          path: tcms-can-test
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install --upgrade pip
          # 含 lint extra：ruff 在 lint 组里，只装 test 会让下一步 `ruff check` 报
          # command not found（exit 127）
          pip install -e ".[test,lint]"
          # 上游被测平台的运行依赖（真实执行时 subprocess 需要）
          pip install python-can cantools pyyaml pytest pytest-cov
      - name: Lint
        run: ruff check .
      - name: Test with coverage gate
        # 上游与 testgen 平级；TCMS_UPSTREAM_ROOT 显式指向避免误判
        env:
          TCMS_UPSTREAM_ROOT: ${{ github.workspace }}/tcms-can-test
        run: pytest tests --cov=tcms_ai_testgen --cov-fail-under=90 -q
      - name: Selfcheck (real-exec mode against upstream)
        env:
          TCMS_UPSTREAM_ROOT: ${{ github.workspace }}/tcms-can-test
        run: python scripts/selfcheck.py
