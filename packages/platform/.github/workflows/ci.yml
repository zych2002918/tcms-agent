# 平台 CI（P2-5）：pytest + ruff + vitest 变成 push/PR 门禁
#
# 双仓布局（与 tests 的 UPSTREAM 解析对齐）：
#   $GITHUB_WORKSPACE/
#     ├─ platform/          ← 本仓库（tests/test_*.py 用 parents[2] 找 tcms-can-test）
#     └─ tcms-can-test/     ← 上游引擎（NEEDS_UPSTREAM 测试的真实资产源）
# e2e 需起本地 server + playwright，成本高，故不在此 job 内（本地脚本保留）。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform
      - uses: actions/checkout@v4
        with:
          repository: zych2002918/tcms-can-test
          path: tcms-can-test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install platform (test + lint)
        run: |
          pip install -e ".[test,lint]"
      - name: Ruff lint
        run: |
          python -m ruff check src tests
      - name: Pytest（真实上游资产门禁）
        run: |
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Frontend pure-logic tests
        working-directory: platform/web
        run: |
          pnpm install --frozen-lockfile
          pnpm vitest run
