  recovery: 完整性回路恢复 + 人工复位
  action_note: SIL4 严重安全原因：列车完整性丧失 → 紧急制动环线失电 → 同时切除牵引并施加紧急制动（与 traction_loss 的降级处置互为原因分支：可恢复部件级牵引丢失不升级 EB，完整性/门联锁等安全原因才走 EB 环线）。
