# 场景 5：总线短路 → 断路 级联 —— 物理层故障影响全体节点
# F-TCMS-014 bus_short (critical, shutdown) + F-TCMS-018 bus_open_circuit (major, derate)
# 短路为灾难级（持续显性），移除后按错误计数器衰减恢复
name: 总线短路与断路级联
desc: 演示故障序列：总线短路、总线断路。
steps:
  - at: 5.0
    inject:
      node: bus
      fault: bus_short
      level: critical
      impact: CAN 总线持续显性，全节点错误帧/Bus-Off
      expect: shutdown
  - at: 12.0
    recover: bus_short
  - at: 14.0
    inject:
      node: bus
      fault: bus_open_circuit
      level: major
      impact: 断路无 ACK，发送侧 TEC 上升至 Error-Passive
      expect: derate
  - at: 20.0
    recover: bus_open_circuit
