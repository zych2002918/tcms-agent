# TCMS × AI —— monorepo 统一 CI
#
# 合并三仓后最大的收益：**不再需要 checkout「别的仓库」当兄弟目录**。
# 上游引擎就是本仓的 packages/engine，所有 job 直接用工作区内的相对路径。
#
# 设计原则：
#   - 每个成员一个 job，以该成员为 rootdir 跑 → 保留各自的覆盖率门禁与 marker 配置；
#   - job 之间无 checkout 耦合，路径全为仓内相对路径；
#   - lint 与成员测试并行；成员之间互不阻塞（fail-fast: false）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 上游引擎位置（成员测试统一使用；monorepo 内是仓内相对路径）
  TCMS_UPSTREAM_DIR: ${{ github.workspace }}/packages/engine
  TCMS_UPSTREAM_ROOT: ${{ github.workspace }}/packages/engine

jobs:
  # ---------------------------------------------------------------------------
  # 全仓 lint（ruff 口径由根 pyproject 统一）
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: Ruff check (all members)
        run: ruff check packages
      - name: 工作区定义校验（uv.lock 可用）
        uses: astral-sh/setup-uv@v5
      - name: uv lock --check
        run: uv lock --check
      # 分发卫生：.ps1 的 BOM / .bat 的纯 ASCII / 行尾 / 说明文档里的入口是否存在。
      # 这些约束只在别人拿到压缩包时才会出事，本机怎么跑都是好的，
      # 所以必须进 CI —— 而且它们此前确实被漏在 testpaths 之外（见下条注释）。
      #
      # 只装 pytest，不装项目依赖：这批测试只 import 标准库（pathlib/re/ast），
      # 不碰任何成员包。此前写成 `uv run --no-project pytest`，
      # 而 --no-project 恰恰意味着"不用项目环境"→ pytest 不存在 →
      # `error: Failed to spawn: pytest`（CI 上真红过一次）。
      - name: Install pytest (only for the hygiene tests)
        run: python -m pip install -q pytest
      - name: 分发卫生测试（不依赖成员包）
        run: python -m pytest tests -q -p no:cacheprovider

  # ---------------------------------------------------------------------------
  # packages/engine —— 领域引擎（独立包，无内部依赖）
  # ---------------------------------------------------------------------------
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke layer (core safety paths)
        run: python -m pytest tests/ -m smoke -q --tb=short
      - name: "Full regression (coverage gate from pyproject, fail_under=97)"
        run: |
          python -m pytest tests/ -q --tb=short \
            --junitxml=reports/junit-py${{ matrix.python-version }}.xml \
            --cov=tcms --cov-report=term --cov-report=json
      - name: Upload coverage JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-coverage-py${{ matrix.python-version }}
          path: packages/engine/coverage.json
      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-junit-py${{ matrix.python-version }}
          path: packages/engine/reports/junit-py${{ matrix.python-version }}.xml

  # ---------------------------------------------------------------------------
  # packages/platform —— 平台 + 知识底座 + Web（依赖 engine）
  # ---------------------------------------------------------------------------
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install engine (workspace member) + platform
        run: |
          python -m pip install --upgrade pip
          pip install -e ../engine
          pip install -e ".[test,lint]"
      - name: Ruff lint
        run: python -m ruff check src tests
      - name: Pytest（真实上游资产门禁）
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Frontend pure-logic tests
        working-directory: packages/platform/web
        run: |
          pnpm install --frozen-lockfile
          pnpm vitest run

  # ---------------------------------------------------------------------------
  # packages/testgen —— 受约束生成与自愈评测（依赖 engine 做真实执行）
  # ---------------------------------------------------------------------------
  testgen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/testgen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install engine (workspace member) + testgen
        run: |
          python -m pip install --upgrade pip
          pip install -e ../engine
          pip install -e ".[test,lint]"
      - name: Lint
        run: ruff check .
      - name: Test with coverage gate
        run: pytest tests --cov=tcms_ai_testgen --cov-fail-under=90 -q
      - name: Selfcheck (real-exec mode against upstream engine)
        run: python scripts/selfcheck.py

  # ---------------------------------------------------------------------------
  # packages/agent —— LangGraph Agent（离线规则臂，**不需要任何 API key**）
  # ---------------------------------------------------------------------------
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install workspace members (engine + platform + testgen + agent)
        # 注意：agent 的 pyproject 用 [tool.uv.sources] 把三个成员指向工作区，
        # 但 **uv.sources 是 uv 专属特性，pip 不认**——pip 会去 PyPI 找这些包而失败。
        # 因此这里必须先把三个成员 editable 装上，pip 才会认为依赖已满足。
        run: |
          python -m pip install --upgrade pip
          pip install -e ../engine
          pip install -e ../platform
          pip install -e ../testgen
          pip install -e ".[test,lint]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Pytest（离线规则臂端到端：图 / 工具门禁 / 引用校验 / 轨迹回放）
        env:
          TCMS_UPSTREAM_DIR: ${{ github.workspace }}/packages/engine
          TCMS_AGENT_DB: ${{ runner.temp }}/tcms-agent-ci.sqlite
        run: pytest -q
      - name: CLI smoke (tools / doctor)
        env:
          TCMS_UPSTREAM_DIR: ${{ github.workspace }}/packages/engine
          TCMS_AGENT_DB: ${{ runner.temp }}/tcms-agent-ci.sqlite
        run: |
          python -m tcms_agent.cli tools | head -20
          python -m tcms_agent.cli doctor

  # ---------------------------------------------------------------------------
  # 真浏览器验收（e2e）—— 把 P2-5 当初因"起本地 server 成本高"砍掉的最后一段补回来
  #
  # 为什么现在必须进 CI：这批断言全是"界面不骗人"类，而且**只有真浏览器能验**：
  #   · 图谱默认骨架进页即显，且计数与后端一致；
  #   · 「解析不到的种子必须给出空态解释」—— 防白屏；
  #   · 2D/3D 分段控件按 role 可达；FaultLab 动画真的推进到故障高亮。
  # 反面教材（本仓真发生过）：脚本按 role="button" 找 2D/3D 切换，而该控件后来改成了
  # 正确的 role="tab" —— 验收脚本于是静默失效 4 天，而 **CI 全绿、没有任何东西提醒**。
  # 这类失效靠单测挡不住（单测是纯逻辑，不碰 DOM），唯一能挡住的就是在 CI 里真跑一次。
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install engine (workspace member) + platform
        run: |
          python -m pip install --upgrade pip
          pip install -e ../engine
          pip install -e ".[test,lint]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Build web/dist（e2e 打的是真实产物，不是 dev server）
        working-directory: packages/platform/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: 浏览器驱动（e2e/package.json 有意不入库，故就地装；版本与脚本依赖对齐）
        working-directory: packages/platform/e2e
        run: |
          npm install --no-save playwright-core@^1.63.0 playwright@^1.63.0
          npx playwright install --with-deps chromium
      # 起服务与跑断言放在**同一个 step**：GitHub Actions 每个 step 是独立 shell，
      # 跨 step 挂后台进程是已知的脆弱点，合并成一个 step 就不存在这个风险。
      - name: 真浏览器验收（起真实服务 + 真实 dist → e2e/main-flow.mjs）
        run: |
          nohup python -m uvicorn tcms_ai_platform.server.app:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/health >/dev/null && break
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:8000/api/health >/dev/null; then
            echo "::error::服务起不来（端口 8000）"
            tail -60 "$RUNNER_TEMP/uvicorn.log"
            exit 1
          fi
          # 预热知识底座：首次 /api/kb/overview 会现场构建图谱（CI runner 比本机慢），
          # 不预热就会撞上 e2e 里"等文案出现"的 20s 超时，变成假失败。
          curl -sf "http://127.0.0.1:8000/api/kb/overview?limit=3" >/dev/null
          echo "--- server ready，开始真浏览器验收 ---"
          if ! node e2e/main-flow.mjs; then
            echo "::group::uvicorn log"
            tail -100 "$RUNNER_TEMP/uvicorn.log"
            echo "::endgroup::"
            exit 1
          fi
