name: Release (engine)

# 打 tag 即发布：`engine-v*` tag 触发后全量回归 + 构建 sdist/wheel + GitHub Release。
# monorepo 约定：各成员用「成员名-v*」前缀区分 tag（engine-v1.13.0 / agent-v0.2.0 …），
# 避免三仓合一后 tag 命名空间冲突。
on:
  push:
    tags:
      - "engine-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt build
      - name: Quality gate (full regression + coverage)
        # 覆盖率门禁单源：pyproject [tool.coverage.report] fail_under=97
        # （与 ci.yml 一致，不再传 --cov-fail-under）
        run: |
          python -m pytest tests/ -q --tb=short --junitxml=reports/junit.xml \
            --cov=tcms --cov-report=term
      - name: Build package
        run: python -m build
      - name: Verify wheel distribution (non-editable smoke)
        # 发布门禁：wheel 装入干净 venv 后从仓库外实证 import + 数据资产 +
        # 入口可用（防"能 build 但装上残"的 Release 资产——v1.9.0 教训）
        run: |
          python -m venv /tmp/venv-rel
          /tmp/venv-rel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/venv-rel/bin/python "$GITHUB_WORKSPACE/packages/engine/scripts/check_dist.py"
          /tmp/venv-rel/bin/tcms-test --version
      - name: Generate release notes
        run: |
          python - <<'EOF'
          import re, pathlib
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # 取最新版本段（到下一个 ## 前）
          m = re.search(r"## \[([^\]]+)\] - (.+?)\n(.*?)(?=\n## |\Z)", text, re.S)
          if not m:
              raise SystemExit("CHANGELOG 最新版本段缺失")
          pathlib.Path("release_notes.md").write_text(
              f"# v{m.group(1)} ({m.group(2)})\n\n{m.group(3).strip()}\n",
              encoding="utf-8",
          )
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # 注意：action 的路径相对**仓库根**——`defaults.run.working-directory` 只作用于
          # run 步骤。因此这里必须带 `packages/engine/` 前缀，否则 Release 会因找不到
          # body / 附件而失败；而失败点藏在一个**从未触发过**的 workflow 里，极难发现。
          body_path: packages/engine/release_notes.md
          files: |
            packages/engine/dist/*.whl
            packages/engine/dist/*.tar.gz
